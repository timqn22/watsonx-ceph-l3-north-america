<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceph Tracker Linker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 350px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #24292e;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .status.loading {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
        }

        .info-section {
            margin-bottom: 16px;
        }

        .info-section h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #586069;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e1e4e8;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 500;
            color: #586069;
        }

        .info-value {
            color: #24292e;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: #0366d6;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #0256c7;
        }

        .btn-secondary {
            background: #f6f8fa;
            color: #24292e;
            border: 1px solid #e1e4e8;
        }

        .btn-secondary:hover {
            background: #e1e4e8;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0366d6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .footer {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e1e4e8;
            font-size: 12px;
            color: #586069;
            text-align: center;
        }

        .footer a {
            color: #0366d6;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>🔗 Ceph Tracker Linker</h1>

    <div id="status" class="status loading">
        <span class="spinner"></span>
        Checking API status...
    </div>

    <div id="info" style="display: none;">
        <div class="info-section">
            <h2>API Status</h2>
            <div class="info-item">
                <span class="info-label">Endpoint:</span>
                <span class="info-value" id="api-url">localhost:5001</span>
            </div>
            <div class="info-item">
                <span class="info-label">Status:</span>
                <span class="info-value" id="api-status">Unknown</span>
            </div>
        </div>

        <div class="info-section">
            <h2>Current Page</h2>
            <div class="info-item">
                <span class="info-label">Type:</span>
                <span class="info-value" id="page-type">Unknown</span>
            </div>
            <div class="info-item">
                <span class="info-label">ID:</span>
                <span class="info-value" id="page-id">N/A</span>
            </div>
        </div>

        <button id="refresh-btn" class="btn btn-primary">
            Refresh Recommendations
        </button>

        <button id="settings-btn" class="btn btn-secondary">
            Settings
        </button>
    </div>

    <div class="footer">
        <p>AI-powered tracker-PR linking</p>
        <p><a href="https://github.com/ceph/ceph" target="_blank">Ceph Project</a></p>
    </div>

    <script src="popup.js"></script>
</body>

</html>
